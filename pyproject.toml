[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurorisk"
version = "0.1.0"
description = "Ensemble models and interpretable risk scores for Alzheimer's prediction"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
optuna = ["optuna>=3.5"]
shap = ["shap>=0.45"]
all = ["neurorisk[xgboost,optuna,shap]"]
dev = ["pytest>=8"]

[project.scripts]
neurorisk = "neurorisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurorisk = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
